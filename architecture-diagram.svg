<svg width="820" height="400" viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>private-ai architecture — how the pieces relate</title>
<desc>Shared architecture feeds Home AI, Community AI, and Coop AI. Community AI and Coop AI both feed the Archiver Protocol. Community AI also feeds the Network Library, which feeds the Network Library Public Mirror.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#222;}
.sub{fill:#555;font-size:11px;}
.cap{fill:#555;font-size:12px;}
@media (prefers-color-scheme: dark){
  text{fill:#e8e8e8;}
  .sub{fill:#aaa;}
  .cap{fill:#aaa;}
  svg{background:transparent;}
}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#888"/>
</marker>
</defs>

<!-- ARCH -->
<rect x="20" y="30" width="150" height="300" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="95" y="170" text-anchor="middle" font-size="13" font-weight="600">Shared</text>
<text x="95" y="188" text-anchor="middle" font-size="13" font-weight="600">architecture</text>
<text x="95" y="210" text-anchor="middle" class="sub">git-based storage</text>
<text x="95" y="225" text-anchor="middle" class="sub">oikb ingestion</text>
<text x="95" y="240" text-anchor="middle" class="sub">Tailscale access</text>

<!-- HOME -->
<rect x="220" y="30" width="150" height="60" rx="8" fill="#d4f4dd" stroke="#2f855a" stroke-width="2"/>
<text x="295" y="55" text-anchor="middle" font-size="13" font-weight="600">Home AI</text>
<text x="295" y="72" text-anchor="middle" class="sub">Phase 1 — active</text>

<!-- COMM -->
<rect x="220" y="120" width="150" height="60" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="295" y="145" text-anchor="middle" font-size="13" font-weight="600">Community AI</text>
<text x="295" y="162" text-anchor="middle" class="sub">Phase 2 — deferred</text>

<!-- COOP -->
<rect x="220" y="270" width="150" height="60" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="295" y="295" text-anchor="middle" font-size="13" font-weight="600">Coop AI</text>
<text x="295" y="312" text-anchor="middle" class="sub">Phase 2 — deferred</text>

<!-- NL -->
<rect x="420" y="120" width="150" height="60" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="495" y="145" text-anchor="middle" font-size="13" font-weight="600">Network Library</text>
<text x="495" y="162" text-anchor="middle" class="sub">federation-private</text>

<!-- PROTO -->
<rect x="420" y="195" width="150" height="60" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="495" y="218" text-anchor="middle" font-size="13" font-weight="600">Archiver Protocol</text>
<text x="495" y="233" text-anchor="middle" class="sub">identity + Loomio</text>
<text x="495" y="246" text-anchor="middle" class="sub">governance</text>

<!-- MIRROR -->
<rect x="630" y="120" width="170" height="60" rx="8" fill="#fff3cd" stroke="#d69e2e" stroke-width="2"/>
<text x="715" y="142" text-anchor="middle" font-size="13" font-weight="600">Network Library</text>
<text x="715" y="158" text-anchor="middle" font-size="13" font-weight="600">Public Mirror</text>
<text x="715" y="174" text-anchor="middle" class="sub">the one public exception</text>

<!-- arrows -->
<path d="M170,60 L220,60" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M170,150 L220,150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M170,300 L220,300" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M370,150 L420,150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M370,160 L400,160 L400,225 L420,225" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M370,290 L400,290 L400,225 L420,225" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M570,150 L630,150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- legend -->
<rect x="20" y="360" width="14" height="14" rx="3" fill="#d4f4dd" stroke="#2f855a"/>
<text x="40" y="371" class="cap">active now</text>
<rect x="150" y="360" width="14" height="14" rx="3" fill="#f5f5f5" stroke="#999" stroke-dasharray="3 3"/>
<text x="170" y="371" class="cap">Phase 2, deferred</text>
<rect x="330" y="360" width="14" height="14" rx="3" fill="#fff3cd" stroke="#d69e2e"/>
<text x="350" y="371" class="cap">the one public exception</text>
</svg>
