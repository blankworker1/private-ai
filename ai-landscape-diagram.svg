<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>AI ecosystem landscape — household network and federation</title>
<desc>A household network container holds four states: personal layer device (private), individual AI chat (private), channels group chat (household-shared), and shared library documents (household-shared, feeds the AI). The shared library connects outward to a separate network library box, which is public and federated across nodes.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
</style>
</defs>

<rect x="40" y="60" width="600" height="250" rx="20" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text class="th" x="60" y="90" fill="#27500A">Household network</text>
<text class="ts" x="60" y="108" fill="#3B6D11">Local LAN + remote via Tailscale</text>

<rect x="60" y="130" width="270" height="70" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="195" y="152" text-anchor="middle" dominant-baseline="central" fill="#444441">Personal layer</text>
<text class="ts" x="195" y="172" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Device vault, private only</text>

<rect x="350" y="130" width="270" height="70" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="485" y="152" text-anchor="middle" dominant-baseline="central" fill="#444441">Individual AI chat</text>
<text class="ts" x="485" y="172" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">1-to-1 room, private</text>

<rect x="60" y="220" width="270" height="70" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="195" y="242" text-anchor="middle" dominant-baseline="central" fill="#085041">Channels</text>
<text class="ts" x="195" y="262" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Group chat, household-wide</text>

<rect x="350" y="220" width="270" height="70" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="485" y="242" text-anchor="middle" dominant-baseline="central" fill="#085041">Shared library</text>
<text class="ts" x="485" y="262" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Documents feed the AI</text>

<path d="M485 290 L485 330 L340 330 L340 350" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="350" width="260" height="90" rx="16" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="340" y="378" text-anchor="middle" dominant-baseline="central" fill="#712B13">Network library</text>
<text class="ts" x="340" y="398" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Public, federated nodes</text>
</svg>
