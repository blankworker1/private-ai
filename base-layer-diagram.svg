<svg width="700" height="480" viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Low-cost base layer — shared components assembled differently per use case</title>
<desc>Two assemblies built from a shared component. The AI cafe exhibition assembly contains three independent Micro Brain plus Tablet seats, no shared queue. The Household base layer assembly contains one Micro Brain plus Tablet, plus an optional Power Control Node that only applies when solar or mining hardware is present, connected by a short arrow showing it reports data to the Micro Brain.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
</style>
</defs>

<rect x="40" y="50" width="300" height="340" rx="20" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text class="th" x="60" y="80" fill="#27500A">AI Cafe Exhibition</text>
<text class="ts" x="60" y="98" fill="#3B6D11">3 independent seats</text>

<rect x="60" y="120" width="260" height="70" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="190" y="145" text-anchor="middle" dominant-baseline="central" fill="#085041">Micro Brain + Tablet</text>
<text class="ts" x="190" y="165" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Seat 1</text>

<rect x="60" y="205" width="260" height="70" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="190" y="230" text-anchor="middle" dominant-baseline="central" fill="#085041">Micro Brain + Tablet</text>
<text class="ts" x="190" y="250" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Seat 2</text>

<rect x="60" y="290" width="260" height="70" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="190" y="315" text-anchor="middle" dominant-baseline="central" fill="#085041">Micro Brain + Tablet</text>
<text class="ts" x="190" y="335" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Seat 3</text>

<rect x="360" y="50" width="300" height="300" rx="20" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text class="th" x="380" y="80" fill="#27500A">Household Base Layer</text>
<text class="ts" x="380" y="98" fill="#3B6D11">1 seat + optional module</text>

<rect x="380" y="120" width="260" height="70" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="510" y="145" text-anchor="middle" dominant-baseline="central" fill="#085041">Micro Brain + Tablet</text>
<text class="ts" x="510" y="165" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Same as exhibition seat</text>

<path d="M510 210 L510 190" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="380" y="210" width="260" height="70" rx="12" fill="#FCF3E3" stroke="#9A6B00" stroke-width="1" stroke-dasharray="6 4"/>
<text class="th" x="510" y="235" text-anchor="middle" dominant-baseline="central" fill="#6B4A00">Power Control Node</text>
<text class="ts" x="510" y="255" text-anchor="middle" dominant-baseline="central" fill="#9A6B00">Optional — solar/mining only</text>

<rect x="40" y="410" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text class="ts" x="62" y="421" fill="#333">Shared component — same hardware &amp; software everywhere</text>
<rect x="40" y="434" width="14" height="14" rx="3" fill="#FCF3E3" stroke="#9A6B00" stroke-dasharray="4 3"/>
<text class="ts" x="62" y="445" fill="#333">Amber, dashed — household-only optional module</text>
</svg>
